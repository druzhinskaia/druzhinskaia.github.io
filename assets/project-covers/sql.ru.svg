<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img"><title>От данных к показателям</title><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="800" height="500" rx="0" fill="#f6f3ec"/><rect x="32" y="34" width="5" height="44" rx="2" fill="#0c776f"/><text x="54" y="63" font-size="26" fill="#0c776f" font-weight="700">SQLITE / HTML / JAVASCRIPT</text><text x="40" y="121" font-size="40" fill="#183b37" font-weight="700">От данных к показателям</text><rect x="40" y="155" width="345" height="110" rx="12" fill="#ffffff"/><text x="62" y="203" font-size="42" fill="#183b37" font-weight="700">1 660</text><text x="62" y="242" font-size="27" fill="#52635e" font-weight="400">заказов без отмен</text><rect x="415" y="155" width="345" height="110" rx="12" fill="#ffffff"/><text x="437" y="203" font-size="42" fill="#183b37" font-weight="700">152,4 млн ₽</text><text x="437" y="242" font-size="27" fill="#52635e" font-weight="400">выручка по модели</text><rect x="40" y="312" width="230" height="68" rx="12" fill="#e0e9e4"/><text x="58" y="356" font-size="29" fill="#183b37" font-weight="700">5 таблиц</text><rect x="285" y="312" width="230" height="68" rx="12" fill="#e0e9e4"/><text x="303" y="356" font-size="29" fill="#183b37" font-weight="700">SQL-витрина</text><rect x="530" y="312" width="230" height="68" rx="12" fill="#e0e9e4"/><text x="548" y="356" font-size="29" fill="#183b37" font-weight="700">Дашборд</text><text x="40" y="418" font-size="28" fill="#183b37" font-weight="400">Месяц + канал → общий пересчёт KPI</text><path d="M40 439H760" stroke="#d9d5ca"/><text x="40" y="476" font-size="25" fill="#52635e" font-weight="400">Браузерный BI-прототип · не Power BI</text></g></svg>