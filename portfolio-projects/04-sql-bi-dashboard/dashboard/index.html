<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Продажи · SQL dashboard</title><style>body{margin:0;background:#f1f5f7;color:#193542;font:16px system-ui}main{max-width:1180px;margin:auto;padding:28px}h1{margin-bottom:6px}.muted{color:#5a6b73}select,button{padding:10px;border:1px solid #a9bdc6;border-radius:6px;background:white}.filters{display:flex;gap:16px;flex-wrap:wrap;margin:24px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card,section{background:white;border-radius:10px;padding:18px;margin-bottom:16px}.value{font-size:25px;font-weight:650;color:#206879}.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;margin-top:18px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;border-bottom:1px solid #e3ebed;padding:9px}td:last-child,th:last-child{text-align:right}.bar{height:8px;background:#2a7f90;border-radius:4px;margin:5px 0}.scroll{overflow:auto}@media(max-width:440px){.panels{grid-template-columns:1fr}main{padding:16px}}</style>
<main><h1 id="title">Продажи и задолженность</h1><p id="description" class="muted"></p>
<div class="filters"><label><span id="monthLabel"></span> <select id="month"></select></label><label><span id="channelLabel"></span> <select id="channel"></select></label><button id="lang">English</button></div>
<div id="cards" class="cards"></div><p id="empty" class="muted"></p><div class="panels"><section><h2 id="monthlyTitle"></h2><div id="monthly" class="scroll"></div></section><section><h2 id="categoryTitle"></h2><div id="categories" class="scroll"></div></section><section><h2 id="channelTitle"></h2><div id="channels" class="scroll"></div></section><section><h2 id="debtTitle"></h2><div id="debtors" class="scroll"></div></section></div>
<p id="limits" class="muted"></p><a href="../README.md">README</a></main><script src="data.js"></script><script src="model.js"></script><script>
let language='ru';const el=id=>document.getElementById(id),data=window.SALES_DATA;
const labels={ru:{title:'Продажи и задолженность',description:'Данные автора проекта. Все блоки пересчитываются по выбранным месяцу и каналу. Отменённые заказы исключены.',monthLabel:'Месяц',channelLabel:'Канал',all:'Все',monthlyTitle:'Выручка по месяцам',categoryTitle:'Категории',channelTitle:'Каналы',debtTitle:'Задолженность по клиентам (топ-15)',empty:'По выбранным условиям заказов нет.',limits:'Маржа = суммарная прибыль / выручка. Оплаты агрегируются до заказа. Переплаты показаны отдельно. Задолженность — остаток, а не обязательно просрочка; исторический срез оплат не восстановлен.',orders:'Заказы',revenue:'Выручка',margin:'Маржинальность',avg_order_value:'Средний чек',receivables:'Задолженность',overpayments:'Переплаты',name:'Срез'},en:{title:'Sales and receivables',description:'Author-provided data. Month and channel filters recalculate every panel. Cancelled orders are excluded.',monthLabel:'Month',channelLabel:'Channel',all:'All',monthlyTitle:'Revenue by month',categoryTitle:'Categories',channelTitle:'Channels',debtTitle:'Receivables by customer (top 15)',empty:'No orders match these filters.',limits:'Margin = total profit / revenue. Payments are aggregated per order. Overpayments are separate. Outstanding balance does not necessarily mean overdue debt; historical payment snapshots are unavailable.',orders:'Orders',revenue:'Revenue',margin:'Margin',avg_order_value:'Average order value',receivables:'Receivables',overpayments:'Overpayments',name:'Group'}};
function options(id,values){const selected=el(id).value;el(id).replaceChildren();for(const v of ['',...values]){const o=document.createElement('option');o.value=v;o.textContent=v||labels[language].all;el(id).append(o)}el(id).value=selected;}
function format(n,key){if(n===null||!Number.isFinite(n))return '—';return new Intl.NumberFormat(language==='ru'?'ru-RU':'en-GB',key==='margin'?{style:'percent',maximumFractionDigits:1}:{maximumFractionDigits:key==='orders'?0:0}).format(n)+(key!=='orders'&&key!=='margin'?' ₽':'');}
function table(id,rows,valueKey){const t=document.createElement('table'),head=document.createElement('tr');for(const text of [labels[language].name,labels[language][valueKey]]){const th=document.createElement('th');th.textContent=text;head.append(th)}t.append(head);const maximum=Math.max(0,...rows.map(x=>x[valueKey]));for(const row of rows){const tr=document.createElement('tr'),td=document.createElement('td'),value=document.createElement('td');td.textContent=row.name;const bar=document.createElement('div');bar.className='bar';bar.style.width=(maximum?row[valueKey]/maximum*100:0)+'%';td.append(bar);value.textContent=format(row[valueKey],valueKey);tr.append(td,value);t.append(tr)}el(id).replaceChildren(t);}
function render(){const l=labels[language];document.documentElement.lang=language;for(const id of ['title','description','monthLabel','channelLabel','monthlyTitle','categoryTitle','channelTitle','debtTitle','limits'])el(id).textContent=l[id];options('month',[...new Set(data.orders.map(o=>o.order_date.slice(0,7)))].sort());options('channel',[...new Set(data.orders.map(o=>o.channel))].sort());const m=SalesModel.aggregate(data,{month:el('month').value,channel:el('channel').value});el('cards').replaceChildren();for(const key of ['orders','revenue','margin','avg_order_value','receivables','overpayments']){const card=document.createElement('div'),label=document.createElement('div'),value=document.createElement('div');card.className='card';label.textContent=l[key];value.className='value';value.textContent=format(m[key],key);card.append(label,value);el('cards').append(card)}el('empty').textContent=m.orders?'':l.empty;table('monthly',m.monthly,'revenue');table('categories',m.categories,'revenue');table('channels',m.channels,'revenue');table('debtors',m.debtors,'receivables');el('lang').textContent=language==='ru'?'English':'Русский';}
el('month').onchange=render;el('channel').onchange=render;el('lang').onclick=()=>{language=language==='ru'?'en':'ru';render()};render();
</script></html>
