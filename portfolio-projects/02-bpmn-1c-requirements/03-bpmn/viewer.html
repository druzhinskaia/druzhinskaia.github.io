<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BPMN — обработка заявок</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f3ec;color:#183b37;font:16px Arial,sans-serif}header{padding:18px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #d9d5ca}h1{font-size:22px;margin:0 auto 0 0}nav{display:flex;gap:8px;flex-wrap:wrap}button,a{font:inherit;color:inherit;border:1px solid #c4cec5;border-radius:8px;padding:10px 14px;background:white;text-decoration:none;cursor:pointer}button:hover,a:hover{border-color:#0c776f}button:focus-visible,a:focus-visible{outline:3px solid #0c776f;outline-offset:2px}#canvas{height:calc(100dvh - 98px);min-height:350px;overflow:hidden;touch-action:none;cursor:grab;background:white;position:relative}#canvas.dragging{cursor:grabbing}img{width:2380px;height:1120px;max-width:none;transform-origin:0 0;user-select:none;pointer-events:none;position:absolute;left:0;top:0}output{min-width:48px;align-self:center;text-align:center}@media(max-width:700px){header{padding:12px;gap:10px}h1{font-size:20px;width:100%}button,a{padding:9px 11px}#canvas{height:calc(100dvh - 144px)}}</style></head>
<body><header><h1 id="title">Обработка заявок</h1><nav aria-label="Управление схемой"><button id="minus" aria-label="Уменьшить">−</button><output id="scale">100%</output><button id="plus" aria-label="Увеличить">+</button><button id="fit">Вписать</button><button id="actual">100%</button><button id="fullscreen">Полный экран</button><button id="language">EN</button><a id="download" href="to-be.bpmn" download>BPMN ↓</a></nav></header><main id="canvas" tabindex="0" aria-label="Схема BPMN: масштаб кнопками или колесом, перемещение перетаскиванием"><img id="diagram" src="to-be.svg" alt="Процесс обработки заявок с четырьмя дорожками ролей" draggable="false"></main>
<script>
const canvas=document.getElementById('canvas'),diagram=document.getElementById('diagram'),scale=document.getElementById('scale');let zoom=1,x=0,y=0,lang='ru';const pointers=new Map();let gesture=null;
function draw(){diagram.style.transform=`translate(${x}px,${y}px) scale(${zoom})`;scale.textContent=Math.round(zoom*100)+'%'}
function setZoom(next,cx=canvas.clientWidth/2,cy=canvas.clientHeight/2){next=Math.min(2.5,Math.max(.08,next));x=cx-(cx-x)*next/zoom;y=cy-(cy-y)*next/zoom;zoom=next;draw()}
function fit(){zoom=Math.min(canvas.clientWidth/2380,canvas.clientHeight/1120)*.96;x=(canvas.clientWidth-2380*zoom)/2;y=(canvas.clientHeight-1120*zoom)/2;draw()}
document.getElementById('plus').onclick=()=>setZoom(zoom*1.3);document.getElementById('minus').onclick=()=>setZoom(zoom/1.3);document.getElementById('fit').onclick=fit;document.getElementById('actual').onclick=()=>setZoom(1);
document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await canvas.requestFullscreen();fit()}catch{}};
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();setZoom(zoom*Math.exp(-e.deltaY*.002),e.clientX-r.left,e.clientY-r.top)},{passive:false});
function resetGesture(){const p=[...pointers.values()];gesture=p.length===2?{dist:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),zoom}:null}
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.classList.add('dragging');resetGesture()};
canvas.onpointermove=e=>{const previous=pointers.get(e.pointerId);if(!previous)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){x+=e.clientX-previous.x;y+=e.clientY-previous.y;draw()}else if(pointers.size===2&&gesture){const p=[...pointers.values()],r=canvas.getBoundingClientRect();setZoom(gesture.zoom*Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)/Math.max(gesture.dist,1),(p[0].x+p[1].x)/2-r.left,(p[0].y+p[1].y)/2-r.top)}};
function end(e){pointers.delete(e.pointerId);resetGesture();if(!pointers.size)canvas.classList.remove('dragging')}canvas.onpointerup=end;canvas.onpointercancel=end;
canvas.onkeydown=e=>{if(['+','=','-','0','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();if(e.key==='+'||e.key==='=')setZoom(zoom*1.3);if(e.key==='-')setZoom(zoom/1.3);if(e.key==='0')fit();if(e.key==='ArrowLeft')x+=60;if(e.key==='ArrowRight')x-=60;if(e.key==='ArrowUp')y+=60;if(e.key==='ArrowDown')y-=60;draw()};
document.getElementById('language').onclick=()=>{lang=lang==='ru'?'en':'ru';const ru=lang==='ru';document.documentElement.lang=lang;diagram.src=ru?'to-be.svg':'to-be.en.svg';diagram.alt=ru?'Процесс обработки заявок с четырьмя дорожками ролей':'Request process with four role lanes';document.getElementById('title').textContent=ru?'Обработка заявок':'Request processing';document.getElementById('fit').textContent=ru?'Вписать':'Fit';document.getElementById('fullscreen').textContent=ru?'Полный экран':'Fullscreen';document.getElementById('language').textContent=ru?'EN':'RU';document.getElementById('download').href=ru?'to-be.bpmn':'to-be.en.bpmn';document.getElementById('minus').ariaLabel=ru?'Уменьшить':'Zoom out';document.getElementById('plus').ariaLabel=ru?'Увеличить':'Zoom in'};
diagram.onload=fit;window.addEventListener('resize',fit);
</script></body></html>
